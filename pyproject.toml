[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gif2mp4"
version = "1.0.0"
description = "Convert a GIF to an MP4 or WebM that plays everywhere, with ffmpeg."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Ziztu" }]
keywords = ["gif", "mp4", "webm", "ffmpeg", "gif-to-mp4", "converter"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/0xnirlin/gif-to-video"

[project.scripts]
gif2mp4 = "gif2mp4:main"

[tool.setuptools]
py-modules = ["gif2mp4"]
